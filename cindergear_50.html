// ================= SPRITE ENGINE =================
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function spr(rows,w,h){
  h=h||rows.length;w=w||Math.max(...rows.map(r=>r.length));
  const c=mkCanvas(w,h),x=c.getContext('2d'),id=x.createImageData(w,h),d=id.data;
  for(let j=0;j<h;j++){const r=rows[j]||'';for(let i=0;i<w;i++){
    let v=r[i],idx=-1;
    if(typeof v==='string'){idx=v==='.'?-1:parseInt(v,16);}else if(typeof v==='number')idx=v;
    if(idx>=0&&idx<16){const p=PRGB[idx],o=(j*w+i)*4;d[o]=p[0];d[o+1]=p[1];d[o+2]=p[2];d[o+3]=255;}
  }}
  x.putImageData(id,0,0);return c;
}

function floorArr(seed,fc=1,gc=0){const r=rng(seed);return grid(16,16,(x,y)=>{const off=y<8?0:4;if(y%8===0||(x+off)%8===0)return gc;const q=r();if(q<.05)return 5;if(q<.075)return 13;return fc;});}

function drawText(s,x,y,c,sc=1){s=String(s).toUpperCase();ctx.fillStyle=PAL[c];let cx=Math.round(x);y=Math.round(y);for(const ch of s){const g=FONT[ch];if(g){for(let r=0;r<5;r++){const b=g[r];for(let i=0;i<5;i++)if(b&(16>>i))ctx.fillRect(cx+i*sc,y+r*sc,sc,sc);}}cx+=6*sc;}}

function drawTextS(s,x,y,c,sh,sc=1){drawText(s,x+sc,y+sc,sh,sc);drawText(s,x,y,c,sc);}
function drawTextC(s,y,c,sc=1,sh=-1){const x=Math.round((W-textW(s,sc))/2);if(sh>=0)drawTextS(s,x,y,c,sh,sc);else drawText(s,x,y,c,sc);}
function wrapText(str,maxChars){
  const words=String(str).toUpperCase().split(' ');
  const lines=[];let cur='';
  for(const w of words){
    if(!cur)cur=w;
    else if(cur.length+1+w.length<=maxChars)cur+=' '+w;
    else{lines.push(cur);cur=w;}
  }
  if(cur)lines.push(cur);
  return lines;
}

let AC=null,master,musicG,sfxG,delayNode,delayFb,delayWet,noiseBuf,muted=false,nextNote=0,step=0;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=muted?0:0.55;master.connect(AC.destination);
  musicG=AC.createGain();musicG.gain.value=0.78;musicG.connect(master);
  sfxG=AC.createGain();sfxG.gain.value=0.78;sfxG.connect(master);

  delayNode=AC.createDelay(1.0);delayNode.delayTime.value=0.22;
  delayFb=AC.createGain();delayFb.gain.value=0.34;
  delayWet=AC.createGain();delayWet.gain.value=0.30;
  delayNode.connect(delayFb);delayFb.connect(delayNode);
  delayNode.connect(delayWet);delayWet.connect(musicG);

  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  nextNote=AC.currentTime+0.1;setInterval(sched,25);

function toggleMute(){muted=!muted;if(master)master.gain.setValueAtTime(muted?0:0.55,AC.currentTime);}
function tone(type,f0,f1,dur,vol,t,dest,sendDelay=false){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest||sfxG);
  if(sendDelay&&delayNode)g.connect(delayNode);
  o.start(t);o.stop(t+dur+0.03);
}
function noise(t,dur,vol,ft,f0,f1,dest){
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=AC.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t,Math.random()*0.5);s.stop(t+dur+0.03);
}

function getActiveTrack(){
  if(state==='title'||state==='loading'||state==='cutscene')return TITLE_TRACK;
  if(state==='shop')return SHOP_TRACK;
  if(state==='win')return WIN_TRACK;
  if(G&&G.floor%5===0&&state==='play')return BOSS_TRACK;
  const bi=G?Math.min(4,Math.floor((G.floor-1)/10)):0;
  return BIOME_TRACKS[bi];
}
function sched(){
  if(!AC||document.hidden)return;
  const tr=getActiveTrack();
  const low=state==='play'&&G&&G.fuel/G.maxFuel<0.25;
  const bpm=tr.bpm+(low?18:0);
  const sd=60/bpm/4;
  if(nextNote<AC.currentTime-0.2)nextNote=AC.currentTime+0.05;
  while(nextNote<AC.currentTime+0.12){
    playStep(step,nextNote,tr,low);
    nextNote+=sd;
    step=(step+1)%64;
  }
}
function playStep(s,t,tr,low){
  const bar=(s>>4)&3,st=s&15;
  const baseMidi=45+tr.rootShift;
  const ch=tr.chords[bar];
  const root=baseMidi+ch[0];
  const bp=tr.bassPat[st];
  if(bp>0){
    const note=root+(bp===2?12:0)-12;
    tone('triangle',mf(note),mf(note),0.20,0.44,t,musicG,false);
  }
  const arpIdx=(st+(bar%2))%3;
  const arpNote=baseMidi+ch[arpIdx]+12;
  if((state!=='title'&&state!=='loading'&&state!=='cutscene')||st%2===0){
    tone('square',mf(arpNote),mf(arpNote),0.055,low?0.045:0.032,t,musicG,true);
  }
  const ln=tr.lead[bar][st];
  if(ln){
    let hold=1;
    for(let k=st+1;k<16&&tr.lead[bar][k]===0;k++)hold++;
    const dur=Math.min(0.55,hold*0.11);
    const freq=mf(baseMidi+12+ln);
    tone(tr.leadWave,freq,freq,dur,0.085,t,musicG,true);
    tone('square',freq*1.004,freq*1.004,dur*0.9,0.032,t+0.008,musicG,false);
  }
  const calm=(state==='title'||state==='loading'||state==='cutscene');
  if(!calm){
    if(st===0||st===8||(tr===BOSS_TRACK&&(st===3||st===11))||(low&&st===12))tone('triangle',155,36,0.13,0.48,t,musicG,false);
    if(st===4||st===12){noise(t,0.11,0.16,'bandpass',1900,850,musicG);tone('triangle',210,95,0.07,0.14,t,musicG,false);}
    if(st%2===0)noise(t,0.025,st%4===2?0.085:0.035,'highpass',7500,7500,musicG);
    if(bar===3&&st>=13){const tomF=190-(st-13)*32;tone('triangle',tomF,tomF*0.5,0.09,0.28,t,musicG,false);noise(t,0.06,0.10,'bandpass',1400,700,musicG);}
  }else{
    if(st%4===0)noise(t,0.018,0.035,'highpass',8500,8500,musicG);
  }
}

function runConsoleCmd(raw){

      if(G)G.fuel=G.maxFuel;
      res='INF_FUEL = '+(CON.infFuel?'1':'0');break;
    case'GODMODE':case'GOD':
      CON.god=!CON.god;
      res='GOD_MODE = '+(CON.god?'1':'0');break;
    case'CLICKPOWER':case'SMITE':
      CON.clickBoom=!CON.clickBoom;
      res='CLICK_SMITE = '+(CON.clickBoom?'1':'0');break;
    case'RAPIDFIRE':case'RAPID':
      CON.rapid=!CON.rapid;
      res='RAPID_FIRE = '+(CON.rapid?'1':'0');break;
    case'INSTAKILL':case'OHKO':
      CON.instakill=!CON.instakill;
      res='INSTAKILL = '+(CON.instakill?'1':'0');break;
    case'FREEZE':
      CON.freeze=!CON.freeze;
      res='ENEMY_FREEZE = '+(CON.freeze?'1':'0');break;
    case'SPEED':
      CON.speedBoost=!CON.speedBoost;
      res='TURBO_SPEED = '+(CON.speedBoost?'1':'0');break;

    case'GEMS999':case'GEMS':
      if(G)G.gems+=999;SAVE.bank+=999;saveGame();

    case'ALLUPGRADES':case'ALLUPG':case'POWER':
      if(G){

        G.fuel=G.maxFuel;
      }
      res='INSTALLED ALL 14 UPGRADES';break;

        applyUpg(arg);res='INSTALLED '+arg.toUpperCase();

    case'OPENEXIT':case'KEY':

      if(G&&state==='play'){G.floor=Math.min(50,G.floor+1);loadFloor();}

        F.map[by*GW+bx]=T.BARREL;res='SPAWNED OIL BARREL';

        F.map[sy*GW+sx]=T.SHRINE;res='SPAWNED BLOOD SHRINE';

      if(F){

    if(e.code==='Escape'){CON.open=false;sfx('blip');}
    else if(e.code==='Enter'||e.code==='NumpadEnter'){runConsoleCmd(CON.buf);}
    else if(e.code==='Backspace'){CON.buf=CON.buf.slice(0,-1);sfx('blip');}
    else if(e.key&&e.key.length===1&&/[a-zA-Z0-9 ]/.test(e.key)&&CON.buf.length<24){
      CON.buf+=e.key.toUpperCase();sfx('blip');
    }
    return;
  }
  if(!e.repeat)pressed[e.code]=true;
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.lDown=false;mouse.rDown=false;});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&AC.state==='suspended')AC.resume();});
const down=(...c)=>c.some(k=>keys[k]);
const hit=(...c)=>c.some(k=>pressed[k]);

// ================= TILES =================
const T={FLOOR:0,WALL:1,CRACK:2,VINE:3,CRATE:4,BARREL:5,ICE:6,WATER:7,GRATE:8,ASH:9,BRAZ:10,EXIT:11,VWALL:12,CAMP:13,STEAM:14,SHRINE:15,SHRINE_USED:16,TABLET:17};
const SOLID=new Uint8Array(22);[T.WALL,T.CRACK,T.VINE,T.CRATE,T.BARREL,T.ICE,T.GRATE,T.BRAZ,T.VWALL,T.CAMP,T.SHRINE,T.SHRINE_USED,T.TABLET].forEach(t=>SOLID[t]=1);
const OPAQUE=new Uint8Array(22);[T.WALL,T.CRACK,T.VINE,T.CRATE,T.BARREL,T.ICE,T.BRAZ,T.VWALL,T.STEAM,T.EXIT,T.SHRINE,T.SHRINE_USED,T.TABLET].forEach(t=>OPAQUE[t]=1);
const isFlam=t=>t===T.VINE||t===T.CRATE||t===T.VWALL;

// ================= GLOBAL STATE =================
let state='loading',time=0,frame=0,G=null,F=null,P=null,S=null;
let parts=[],texts=[],shake=0,hitstop=0,clearT=0,deathT=0;

function tAt(cx,cy){if(cx<0||cy<0||cx>=GW||cy>=GH)return T.WALL;return F.map[cy*GW+cx];}
function isSolid(t,who){if(t===T.EXIT)return!(who==='p'&&F.exitOpen);return SOLID[t]===1;}
function rectSolid(x,y,hw,hh,who){const x0=Math.floor((x-hw)/16),x1=Math.floor((x+hw-0.01)/16),y0=Math.floor((y-hh)/16),y1=Math.floor((y+hh-0.01)/16);for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++)if(isSolid(tAt(cx,cy),who))return true;return false;}
function moveAxis(e,dx,dy,who,slide){
  if(!dx&&!dy)return 0;
  const nx=e.x+dx,ny=e.y+dy;
  if(!rectSolid(nx,ny,e.hw,e.hh,who)){e.x=nx;e.y=ny;return 0;}
  if(slide){const mag=Math.abs(dx+dy);for(let k=1;k<=7;k++){for(const s of[-1,1]){const ox=dy?s*k:0,oy=dx?s*k:0;if(!rectSolid(nx+ox,ny+oy,e.hw,e.hh,who)){const st=Math.min(k,Math.max(0.7,mag));const sx=dy?s*st:0,sy=dx?s*st:0;if(!rectSolid(e.x+sx,e.y+sy,e.hw,e.hh,who)){e.x+=sx;e.y+=sy;return 1;}}}}}
  const sg=Math.sign(dx||dy),steps=Math.ceil(Math.abs(dx||dy)/0.25);
  for(let i=0;i<steps;i++){const tx=e.x+(dx?sg*0.25:0),ty=e.y+(dy?sg*0.25:0);if(rectSolid(tx,ty,e.hw,e.hh,who))break;e.x=tx;e.y=ty;}
  return 2;
}
function moveE(e,dx,dy){const a=moveAxis(e,dx,0,'e'),b=moveAxis(e,0,dy,'e');return a===2||b===2;}
function losClear(x0,y0,x1,y1){const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/4);for(let k=1;k<n;k++){const x=x0+(x1-x0)*k/n,y=y0+(y1-y0)*k/n;if(OPAQUE[tAt(Math.floor(x/16),Math.floor(y/16))])return false;}return true;}
function canSee(e){if(P.dead||P.invis>0)return false;return losClear(e.x,e.y,P.x,P.y);}

// ================= PARTICLES / TEXT =================
function part(x,y,vx,vy,c,life,g,sz){parts.push({x,y,vx,vy,c,life,max:life,g:g||0,s:sz||1});}
function sparks(x,y,n,cols,sp){cols=cols||[8,9,10,7];sp=sp||60;for(let i=0;i<n;i++){const a=R()*Math.PI*2,v=sp*(0.3+R());part(x,y,Math.cos(a)*v,Math.sin(a)*v,cols[i%cols.length],0.25+R()*0.35,60);}}
function smoke(x,y,n){for(let i=0;i<n;i++)part(x+(R()-.5)*8,y+(R()-.5)*8,(R()-.5)*12,-10-R()*16,R()<.5?5:13,0.6+R()*0.6,0,R()<.3?2:1);}
function steamBurst(x,y,n){for(let i=0;i<n;i++)part(x+(R()-.5)*10,y+(R()-.5)*10,(R()-.5)*20,-12-R()*22,R()<.5?6:7,0.6+R()*0.7,-4,R()<.4?2:1);}
function drips(x,y,n){for(let i=0;i<n;i++)part(x+(R()-.5)*10,y,(R()-.5)*30,-20-R()*30,12,0.4+R()*0.3,180);}
function addText(s,x,y,c){texts.push({s:String(s),x,y,c,t:0.95});}

// ================= FLOOR & ENEMY GENERATION (50 FLOORS) =================
function mkEnemy(type,cx,cy,n){
  const scale=1+Math.floor((n-1)/10)*0.35;
  const e={type,x:cx*16+8,y:cy*16+8,hw:5,hh:5,hp:3,flash:0,kx:0,ky:0,state:'patrol',t:0,anim:R()*2,dir:{x:1,y:0},face:1,burnT:0,burnCd:0,bob:0,spin:0};
  if(type==='clock'){e.hp=Math.round((3+Math.floor(n/4))*scale);const h=R()<.5;e.dir=h?{x:1,y:0}:{x:0,y:1};if(R()<.5){e.dir.x*=-1;e.dir.y*=-1;}e.t=2+R()*2;}
  if(type==='drone'){e.hp=Math.round((2+Math.floor(n/5))*scale);e.fireT=1+R()*2;e.state='hover';e.wx=0;e.wy=0;e.wt=0;}
  if(type==='beetle'){e.hp=Math.round((2+Math.floor(n/5))*scale);e.moveT=0;e.zapT=2+R()*2;e.state='skitter';e.mdx=0;e.mdy=0;}
  if(type==='turret'){e.hp=Math.round((3+Math.floor(n/4))*scale);e.fireT=1.4+R()*1.2;e.state='idle';}
  if(type==='knight'){e.hp=Math.round((4+Math.floor(n/3))*scale);e.dir={x:R()<.5?1:-1,y:0};e.face=e.dir.x;e.t=1.5+R();}
  if(type==='boss'){
    const bd=BOSS_DATA[n]||{name:'IRON WARDEN',hp:36+n*5,type:'warden'};
    e.hp=bd.hp;e.maxhp=e.hp;e.hw=7;e.hh=7;e.state='chase';e.t=1.0;e.boss=true;e.bossType=bd.type;e.bossName=bd.name;e.bossFloor=n;e.atkCycle=0;
  }
  return e;
}

function genFloor(n){
  const m=new Uint8Array(N),prot=new Uint8Array(N);
  const f={map:m,burn:new Float32Array(N),bAge:new Float32Array(N),spread:new Uint8Array(N),heat:new Float32Array(N),iceHot:new Float32Array(N),fuse:new Float32Array(N),steamT:new Float32Array(N),fv:new Uint8Array(N),torch:new Uint8Array(N),
    enemies:[],items:[],projs:[],trails:[],arcs:[],flashes:[],keyHeld:false,exitOpen:false,msg:'',msgT:0,spawn:null,tabletLore:(n-1)%STORY_CHRONICLES.length};
  const id=(x,y)=>y*GW+x,inner=(x,y)=>x>=1&&x<=14&&y>=1&&y<=10;
  for(let i=0;i<N;i++){const x=i%GW,y=i/GW|0;m[i]=(x===0||y===0||x===15||y===11)?T.WALL:T.FLOOR;f.fv[i]=ri(0,2);}
  const boss=(n%5===0);
  const sp={x:ri(6,9),y:10},ex={x:ri(2,13),y:1};
  let key=null;
  if(!boss){const left=R()<.5;key={x:left?ri(1,3):ri(12,14),y:ri(3,7)};}
  const protect=(x,y)=>{if(inner(x,y))prot[id(x,y)]=1;};

  function carve(a,b){
    let x=a.x,y=a.y,g=0;protect(x,y);
    while((x!==b.x||y!==b.y)&&g++<400){
      let dx=Math.sign(b.x-x),dy=Math.sign(b.y-y);
      if(R()<0.3){if(R()<.5){dx=R()<.5?-1:1;dy=0;}else{dy=R()<.5?-1:1;dx=0;}}
      else if(dx&&dy){if(R()<.5)dx=0;else dy=0;}
      if(inner(x+dx,y+dy)){x+=dx;y+dy;}protect(x,y);
    }
    while(x!==b.x){x+=Math.sign(b.x-x);protect(x,y);}
    while(y!==b.y){y+=Math.sign(b.y-y);protect(x,y);}
  }

  if(boss){carve(sp,ex);for(let y=3;y<=7;y++)for(let x=4;x<=11;x++)prot[id(x,y)]=2;}
  else{carve(sp,key);carve(key,ex);}
  for(let dx=-1;dx<=1;dx++){protect(sp.x+dx,sp.y);protect(sp.x+dx,sp.y-1);}
  protect(ex.x,ex.y);protect(ex.x,ex.y+1);
  const nearSpawn=(x,y)=>Math.abs(x-sp.x)<=1&&y>=9;

  const clusters=4+Math.min(7,Math.floor(n*0.25));
  for(let k=0;k<clusters;k++){
    let x=ri(1,14),y=ri(1,10);const len=ri(1,3),hor=R()<.5;
    for(let j=0;j<len;j++){if(inner(x,y)&&!prot[id(x,y)])m[id(x,y)]=T.WALL;if(hor)x++;else y++;}
  }
  const biomeIdx=Math.floor((n-1)/10);
  if(n>=2&&biomeIdx!==3){
    const pools=(biomeIdx===1?2:1)+Math.floor(n/12);
    for(let k=0;k<pools;k++){
      const cx=ri(2,13),cy=ri(2,8),r=R()<.5?1:1.6;
      for(let y=cy-2;y<=cy+2;y++)for(let x=cx-2;x<=cx+2;x++){
        if(!inner(x,y)||Math.hypot(x-cx,y-cy)>r)continue;
        const j=id(x,y);if(m[j]!==T.FLOOR||nearSpawn(x,y))continue;
        if(key&&x===key.x&&y===key.y)continue;if(x===ex.x&&y<=ex.y+1)continue;
        m[j]=T.WATER;
      }
    }
  }
  for(let i=0;i<N;i++){
    if(m[i]!==T.FLOOR||prot[i])continue;const x=i%GW,y=i/GW|0;if(!inner(x,y))continue;
    const q=R();let a=0;
    const pb=0.04+Math.min(0.05,n*0.001),pi=(n>=2&&biomeIdx!==3)?(biomeIdx===1?0.08:0.04):0,pg=n>=3?0.035:0;
    if(q<(a+=0.06))m[i]=T.VINE;else if(q<(a+=0.06))m[i]=T.CRATE;else if(q<(a+=pb))m[i]=T.BARREL;
    else if(q<(a+=pi))m[i]=T.ICE;else if(q<(a+=pg))m[i]=T.GRATE;else if(q<(a+=0.03))m[i]=T.CRACK;
  }
  const pp=0.10+Math.min(0.14,n*0.004);
  for(let i=0;i<N;i++){
    if(prot[i]!==1||m[i]!==T.FLOOR)continue;const x=i%GW,y=i/GW|0;
    if(nearSpawn(x,y))continue;if(key&&x===key.x&&y===key.y)continue;if(x===ex.x&&y<=ex.y+1)continue;
    if(R()<pp){const q=R();m[i]=q<.45?T.VINE:q<.8?T.CRATE:(n>=2?T.ICE:T.VINE);}
  }
  if(key){
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const x=key.x+dx,y=key.y+dy;if(!inner(x,y)||(!dx&&!dy))continue;
      const j=id(x,y);if(!prot[j]){m[j]=(n>=3&&R()<.35)?T.GRATE:T.WALL;prot[j]=3;}
    }
    prot[id(key.x,key.y)]=3;
    f.items.push({type:'key',x:key.x*16+8,y:key.y*16+8,vx:0,vy:0,t:0});
  }
  const nAl=1+(n>=4?1:0)+(n>=15?1:0);
  for(let k=0,tries=0;k<nAl&&tries<80;tries++){
    const cx=ri(2,13),cy=ri(2,9);let ok=true;
    for(let dy=-1;dy<=1&&ok;dy++)for(let dx=-1;dx<=1;dx++){const x=cx+dx,y=cy+dy;if(!inner(x,y)||prot[id(x,y)]){ok=false;break;}}
    if(!ok)continue;let side=null;
    for(const s of shuffle(DIR4.slice())){const ox=cx+s[0]*2,oy=cy+s[1]*2;if(inner(ox,oy)){const t=m[id(ox,oy)];if(t===T.FLOOR||t===T.WATER||prot[id(ox,oy)]===1){side=s;break;}}}
    if(!side)continue;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const j=id(cx+dx,cy+dy);m[j]=T.WALL;prot[j]=3;}
    m[id(cx,cy)]=T.FLOOR;
    const ej=id(cx+side[0],cy+side[1]);
    if(R()<0.65||n<2)m[ej]=T.VWALL;else{m[ej]=T.CRACK;const bj=id(cx+side[0]*2,cy+side[1]*2);if(!prot[bj])m[bj]=T.BARREL;else m[ej]=T.VWALL;}
    for(let g=0;g<3;g++)f.items.push({type:'gem',x:cx*16+4+g*4,y:cy*16+6+(g%2)*4,vx:0,vy:0,t:R()*6});
    f.items.push({type:'ember',x:cx*16+8,y:cy*16+12,vx:0,vy:0,t:0});k++;
  }
  const adjPath=(x,y)=>DIR4.some(([dx,dy])=>{const a=x+dx,b=y+dy;return inner(a,b)&&(prot[id(a,b)]===1||prot[id(a,b)]===2);});
  const cands=[];for(let y=1;y<=10;y++)for(let x=1;x<=14;x++){const d=Math.abs(x-sp.x)+Math.abs(y-sp.y);if(d>=2&&d<=3&&!prot[id(x,y)]&&adjPath(x,y))cands.push([x,y]);}
  if(cands.length){const [x,y]=cands[ri(0,cands.length-1)];m[id(x,y)]=T.CAMP;prot[id(x,y)]=3;}
  const nB=1+(n>=4?1:0);const bc=[];for(let y=1;y<=10;y++)for(let x=1;x<=14;x++){if(!prot[id(x,y)]&&adjPath(x,y)&&Math.hypot(x-sp.x,y-sp.y)>4)bc.push([x,y]);}
  shuffle(bc);for(let k=0;k<nB&&k<bc.length;k++){const [x,y]=bc[k];m[id(x,y)]=T.BRAZ;prot[id(x,y)]=3;}
  if(!cands.length&&bc.length>nB){const [x,y]=bc[nB];m[id(x,y)]=T.CAMP;prot[id(x,y)]=3;}

  const specialSpots=[];
  for(let y=2;y<=9;y++)for(let x=2;x<=13;x++){
    const j=id(x,y);if(m[j]===T.FLOOR&&!prot[j]&&adjPath(x,y)&&Math.hypot(x-sp.x,y-sp.y)>2.2)specialSpots.push([x,y]);
  }
  shuffle(specialSpots);
  if(specialSpots.length>0){
    const [tx,ty]=specialSpots.pop();
    m[id(tx,ty)]=T.TABLET;prot[id(tx,ty)]=3;
  }else{
    for(let y=2;y<=9;y++)for(let x=2;x<=13;x++){
      const j=id(x,y);if(m[j]===T.FLOOR&&!(x===sp.x&&y===sp.y)&&!(x===ex.x&&y===ex.y)){m[j]=T.TABLET;prot[id(x,y)]=3;x=99;break;}
    }
  }
  if(specialSpots.length>0&&n>=3&&R()<0.55){
    const [sx2,sy2]=specialSpots.pop();
    m[id(sx2,sy2)]=T.SHRINE;prot[id(sx2,sy2)]=3;
  }

  if(boss){for(const [x,y] of[[4,3],[11,3],[4,7],[11,7]])m[id(x,y)]=T.BARREL;}
  m[id(ex.x,ex.y)]=T.EXIT;m[id(sp.x,sp.y)]=T.FLOOR;
  for(let x=1;x<=14;x++)if(x!==ex.x&&R()<0.24)f.torch[id(x,0)]=1;

  let types=['clock'];
  if(n>=2)types=['clock','drone'];
  if(n>=4)types=['clock','drone','beetle'];
  if(n>=8)types=['clock','drone','beetle','turret'];
  if(n>=12)types=['clock','drone','beetle','turret','knight'];

  const count=boss?1+Math.min(3,Math.floor(n/12)):Math.min(3+Math.floor(n*0.35),12);
  const ec=[];for(let i=0;i<N;i++){const x=i%GW,y=i/GW|0;if(!inner(x,y)||prot[i]===3)continue;const t=m[i];if(t!==T.FLOOR&&t!==T.WATER)continue;if(Math.hypot(x-sp.x,y-sp.y)<5)continue;if(boss&&x>=6&&x<=10&&y>=4&&y<=6)continue;ec.push([x,y]);}
  shuffle(ec);
  for(let k=0;k<count&&k<ec.length;k++){const [x,y]=ec[k];f.enemies.push(mkEnemy(types[ri(0,types.length-1)],x,y,n));}
  if(key){
    const gc=[];for(let y=key.y-3;y<=key.y+3;y++)for(let x=key.x-3;x<=key.x+3;x++){if(!inner(x,y))continue;const j=id(x,y);if(m[j]===T.FLOOR&&prot[j]===1&&Math.hypot(x-key.x,y-key.y)>=1.5&&Math.hypot(x-sp.x,y-sp.y)>=4)gc.push([x,y]);}
    if(gc.length){const [x,y]=gc[ri(0,gc.length-1)];f.enemies.push(mkEnemy(n>=12?'knight':n>=4?'beetle':'clock',x,y,n));}
  }
  if(boss)f.enemies.push(mkEnemy('boss',8,5,n));

  for(let k=0;k<2+Math.floor(n/5);k++){const c=ec[(count+k)%Math.max(1,ec.length)];if(c)f.items.push({type:'gem',x:c[0]*16+8,y:c[1]*16+8,vx:0,vy:0,t:R()*6});}
  f.spawn=sp;
  const bd=BOSS_DATA[n];
  f.msg=bd?('BOSS: '+bd.name):(BIOME_INTROS[n]||('FLR '+pad2(n)+' - '+getBiome(n).name));
  f.msgT=2.6;
  return f;
}

// ================= RUN / FLOOR LIFECYCLE =================
function newRun(skipIntro=false,startFlr=1){
  if(!SAVE.unlocked.includes(SAVE.selected))SAVE.selected='amber';
  const fl=getFlame();
  const tierBonus=Math.floor((startFlr-1)/5);
  const baseFuel=Math.max(40,100+fl.fuelMod+tierBonus*15);
  G={floor:startFlr,maxFuel:baseFuel,fuel:baseFuel,gems:tierBonus*4,phoenixUsed:false,dynamoCharge:0,
    upg:{core:tierBonus,blue:startFlr>=11,trail:startFlr>=16,siphon:startFlr>=6,magnet:startFlr>=6,veil:false,split:startFlr>=26,arc:startFlr>=21,phoenix:false,pierce:fl.pierce,cryo:startFlr>=31,alchemy:false,dynamo:false,greed:false},
    stats:{kills:0,barrels:0,gems:0}};
  loadFloor();
  clearInputEdge();
  if(skipIntro){
    state='play';
  }else if(startFlr===1){
    playCutscene('intro',()=>{clearInputEdge();state='play';});
  }else{
    const csKey=startFlr===11?'tier2':startFlr===21?'tier3':startFlr===31?'tier4':startFlr===41?'tier5':null;
    if(csKey)playCutscene(csKey,()=>{clearInputEdge();state='play';});
    else state='play';
  }
}
function loadFloor(){
  if(G.floor>SAVE.bestFloor){SAVE.bestFloor=G.floor;saveGame();}
  F=genFloor(G.floor);parts=[];texts=[];shake=0;hitstop=0;
  P={x:F.spawn.x*16+8,y:F.spawn.y*16+8,hw:5,hh:5,fx:0,fy:-1,kx:0,ky:0,dashT:0,dashCd:0,shootCd:0,inv:0,hurtT:0,invis:0,boost:0,anim:0,dead:false,charging:false,ddx:0,ddy:0,lastTrail:null,moving:false,waterT:0};
}
function gainFuel(n,x,y){G.fuel=Math.min(G.maxFuel,G.fuel+n);addText('+'+n,x,y-8,11);sfx('fuel');}
function hurtPlayer(amt,sx,sy){
  if(P.dead||P.inv>0||CON.god)return;
  G.fuel-=amt;P.inv=1;P.hurtT=1;
  const d=Math.hypot(P.x-sx,P.y-sy)||1;P.kx=(P.x-sx)/d*170;P.ky=(P.y-sy)/d*170;
  shake=Math.max(shake,4);hitstop=3;sfx('hurt');addText('-'+amt,P.x,P.y-10,8);sparks(P.x,P.y,10,[8,2,9]);
  if(G.fuel<=0)killPlayer();
}
function killPlayer(){
  if(P.dead||CON.god||CON.infFuel)return;
  if(G.upg.phoenix&&!G.phoenixUsed){
    G.phoenixUsed=true;G.fuel=Math.round(G.maxFuel*0.5);P.inv=2.5;P.hurtT=1.2;
    shake=7;hitstop=4;sfx('unlock');
    addText('PHOENIX REBORN!',P.x,P.y-14,10);
    sparks(P.x,P.y,36,[10,9,7,8],140);
    for(const e of F.enemies)if(e.hp>0&&Math.hypot(e.x-P.x,e.y-P.y)<48)damageEnemy(e,5);
    return;
  }
  G.fuel=0;P.dead=true;deathT=1.6;hitstop=4;shake=7;sfx('boom');sparks(P.x,P.y,40,[8,9,10,7],120);smoke(P.x,P.y,16);
}

// ================= ELEMENTAL ENGINE =================
function ignite(cx,cy){
  if(cx<0||cy<0||cx>=GW||cy>=GH)return;const i=cy*GW+cx,t=F.map[i];
  if(isFlam(t)&&F.burn[i]<=0){F.burn[i]=3;F.bAge[i]=0;F.spread[i]=0;sfx('crackle');sparks(cx*16+8,cy*16+8,5);}
  else if(t===T.BARREL&&F.fuse[i]<=0){F.fuse[i]=0.2;if(G.upg.siphon)gainFuel(20,cx*16+8,cy*16+8);}
  else if(t===T.ICE)F.iceHot[i]=Math.max(F.iceHot[i],1);
}
function extinguish(i){F.burn[i]=0;F.bAge[i]=0;F.spread[i]=0;}
function explode(cx,cy){
  const i=cy*GW+cx;F.map[i]=T.ASH;F.fuse[i]=0;G.stats.barrels++;
  const ex=cx*16+8,ey=cy*16+8;
  shake=Math.max(shake,6);hitstop=3;sfx('boom');F.flashes.push({x:ex,y:ey,r:90,t:0.35,max:0.35});
  sparks(ex,ey,30,[8,9,10,7],150);smoke(ex,ey,14);
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const x=cx+dx,y=cy+dy;if(x<0||y<0||x>=GW||y>=GH)continue;const j=y*GW+x,t=F.map[j];
    if(t===T.CRACK||t===T.VWALL){F.map[j]=T.ASH;extinguish(j);sparks(x*16+8,y*16+8,10,[5,6,4,0],70);smoke(x*16+8,y*16+8,4);}
    else if(isFlam(t))ignite(x,y);
    else if(t===T.BARREL){if(F.fuse[j]<=0)F.fuse[j]=0.12;}
    else if(t===T.ICE){F.map[j]=T.WATER;steamBurst(x*16+8,y*16+8,8);}
    else if(t===T.WATER){F.map[j]=T.STEAM;F.steamT[j]=5;steamBurst(x*16+8,y*16+8,10);}}
  for(const e of F.enemies){const d=Math.hypot(e.x-ex,e.y-ey);if(d<30&&e.hp>0){damageEnemy(e,4);if(!e.boss){e.kx=(e.x-ex)/(d||1)*220;e.ky=(e.y-ey)/(d||1)*220;}}}
  if(!P.dead&&!CON.god){const d=Math.hypot(P.x-ex,P.y-ey);if(d<28){hurtPlayer(20,ex,ey);P.kx=(P.x-ex)/(d||1)*200;P.ky=(P.y-ey)/(d||1)*200;}}
  for(const it of F.items){const d=Math.hypot(it.x-ex,it.y-ey);if(d<30&&it.type!=='key'){it.vx+=(it.x-ex)/(d||1)*80;it.vy+=(it.y-ey)/(d||1)*80;}}
}
function floodWater(cx,cy){const set=new Set(),q=[[cx,cy]];set.add(cy*GW+cx);while(q.length){const [x,y]=q.pop();for(const [dx,dy] of DIR4){const a=x+dx,b=y+dy;if(tAt(a,b)!==T.WATER)continue;const j=b*GW+a;if(!set.has(j)){set.add(j);q.push([a,b]);}}}return set;}
function discharge(e,hurtP=true){
  sfx('zap');shake=Math.max(shake,2);sparks(e.x,e.y,16,[10,7,10,12],90);
  if(hurtP&&!P.dead&&Math.hypot(P.x-e.x,P.y-e.y)<22)hurtPlayer(20,e.x,e.y);
  const cx=Math.floor(e.x/16),cy=Math.floor(e.y/16);
  if(tAt(cx,cy)===T.WATER){const set=floodWater(cx,cy);for(const j of set){F.arcs.push({i:j,t:0.45});if(R()<.5)sparks((j%GW)*16+8,(j/GW|0)*16+8,3,[10,7],50);}
    shake=Math.max(shake,4);
    const pj=Math.floor(P.y/16)*GW+Math.floor(P.x/16);if(hurtP&&set.has(pj))hurtPlayer(20,P.x,P.y);
    for(const o of F.enemies)if(o!==e&&o.hp>0&&set.has(Math.floor(o.y/16)*GW+Math.floor(o.x/16)))damageEnemy(o,3);}
}
function updateTiles(dt){
  const m=F.map;
  for(let i=0;i<N;i++){
    const cx=i%GW,cy=i/GW|0,x=cx*16+8,y=cy*16+8;
    if(F.burn[i]>0){F.burn[i]-=dt;F.bAge[i]+=dt;
      if(!F.spread[i]&&F.bAge[i]>=1.2){F.spread[i]=1;for(const [dx,dy] of DIR4)ignite(cx+dx,cy+dy);}
      if(R()<dt*10)part(x+(R()-.5)*14,y+4,(R()-.5)*10,-30-R()*30,R()<.5?9:10,0.4+R()*0.3,-10);
      if(R()<dt*3)smoke(x,y-4,1);
      if(F.burn[i]<=0){F.burn[i]=0;m[i]=T.ASH;smoke(x,y,5);sfx('crackle');}}
    const t=m[i];
    if(t===T.ICE){let hot=F.iceHot[i]>0;if(hot)F.iceHot[i]-=dt;
      if(!hot)for(const [dx,dy] of DIR4){const a=cx+dx,b=cy+dy;if(a>=0&&b>=0&&a<GW&&b<GH&&F.burn[b*GW+a]>0){hot=true;break;}}
      if(!hot&&!P.dead&&Math.hypot(P.x-x,P.y-y)<22)hot=true;
      if(!hot)for(const tr of F.trails)if(Math.hypot(tr.x-x,tr.y-y)<20){hot=true;break;}
      if(hot){F.heat[i]+=dt;if(R()<dt*12)drips(x,y+6,1);if(F.heat[i]>=0.8){m[i]=T.WATER;F.heat[i]=0;sfx('sizzle');steamBurst(x,y,10);}}
      else F.heat[i]=Math.max(0,F.heat[i]-dt*0.3);}
    else if(t===T.BARREL&&F.fuse[i]>0){F.fuse[i]-=dt;if(R()<.6)part(x+(R()-.5)*6,y-6,(R()-.5)*30,-30,R()<.5?10:7,0.2,60);if(F.fuse[i]<=0){F.fuse[i]=0;explode(cx,cy);}}
    else if(t===T.STEAM){F.steamT[i]-=dt;if(R()<dt*5)steamBurst(x,y,1);if(F.steamT[i]<=0)m[i]=T.FLOOR;}
  }
}

// ================= PLAYER =================
function interactNearby(){
  const ccx=Math.floor(P.x/16),ccy=Math.floor(P.y/16);
  for(let yy=ccy-1;yy<=ccy+1;yy++)for(let xx=ccx-1;xx<=ccx+1;xx++){
    if(xx<0||yy<0||xx>=GW||yy>=GH)continue;
    const i=yy*GW+xx,t=F.map[i];
    if(t===T.TABLET){
      unlockLore(F.tabletLore);return true;
    }
    if(t===T.SHRINE){
      if(G.maxFuel>45){
        F.map[i]=T.SHRINE_USED;G.maxFuel-=20;G.fuel=Math.min(G.fuel,G.maxFuel);
        const pool=UPG.filter(u=>!u.stack&&!G.upg[u.id]);
        if(pool.length){const pick=pool[ri(0,pool.length-1)];applyUpg(pick.id);F.msg='SHRINE BOON: '+pick.name;F.msgT=2.4;}
        else{G.gems+=15;F.msg='SHRINE BOON: +15 GEMS';F.msgT=2.2;}
        sfx('shrine');shake=4;sparks(xx*16+8,yy*16+8,20,[14,2,10,7],90);
      }else{sfx('deny');addText('NEED MAX FUEL',P.x,P.y-12,8);}
      return true;
    }
  }
  return false;
}

function updatePlayer(dt){
  const p=P;if(p.dead)return;
  if(CON.infFuel)G.fuel=G.maxFuel;
  const fl=getFlame();
  const ix=(down('KeyD','ArrowRight')?1:0)-(down('KeyA','ArrowLeft')?1:0);
  const iy=(down('KeyS','ArrowDown')?1:0)-(down('KeyW','ArrowUp')?1:0);
  if(ix||iy){if(ix&&iy){if(!(p.fx===ix&&p.fy===0)&&!(p.fy===iy&&p.fx===0)){p.fx=ix;p.fy=0;}}else{p.fx=ix;p.fy=iy;}}
  p.shootCd-=dt;p.dashCd-=dt;p.inv-=dt;p.hurtT-=dt;p.invis-=dt;p.boost-=dt;p.anim+=dt;

  if(hit('KeyE'))interactNearby();

  let aimX=p.fx,aimY=p.fy;
  if(mouse.inBounds&&mouse.y>=HUD){
    const dx=mouse.x-p.x,dy=(mouse.y-HUD)-p.y,l=Math.hypot(dx,dy);
    if(l>2){aimX=dx/l;aimY=dy/l;p.fx=aimX>=0?1:-1;}
  }

  const wantShoot=hit('KeyJ','KeyZ')||mouse.lHit||(CON.rapid&&(down('KeyJ','KeyZ')||mouse.lDown));
  if(wantShoot&&p.shootCd<=0){
    const scost=CON.infFuel?0:(G.upg.split?10:8);
    if(G.fuel>scost||CON.infFuel){
      G.fuel-=scost;
      p.shootCd=CON.rapid?0.06:0.26;
      const baseAng=Math.atan2(aimY,aimX);
      const angles=G.upg.split?[baseAng-0.22,baseAng,baseAng+0.22]:[baseAng];
      const isSuper=G.upg.dynamo&&G.dynamoCharge>=1;
      if(isSuper)G.dynamoCharge=0;
      for(const ang of angles){
        const vx=Math.cos(ang)*175,vy=Math.sin(ang)*175;
        F.projs.push({k:'fb',x:p.x+Math.cos(ang)*6,y:p.y+Math.sin(ang)*6,vx,vy,life:1.4,
          blue:G.upg.blue,arc:G.upg.arc,pierce:G.upg.pierce,super:isSuper,
          dmg:(G.upg.blue?2:1)*fl.dmgMod*(isSuper?3:1),hitSet:new Set()});
      }
      sfx('shoot');sparks(p.x+aimX*8,p.y+aimY*8,isSuper?10:4,[10,9]);
    }else{sfx('deny');addText('LOW FUEL',p.x,p.y-12,8);p.shootCd=0.35;}
  }

  const dcost=CON.infFuel?0:((G.upg.trail||fl.id==='emerald')?7.5:15);
  if((hit('Space','KeyK','KeyX')||mouse.rHit)&&p.dashCd<=0&&p.dashT<=0){
    if(G.fuel>dcost||CON.infFuel){
      G.fuel-=dcost;
      let dx=ix,dy=iy;
      if(!dx&&!dy){dx=aimX;dy=aimY;}
      const l=Math.hypot(dx,dy)||1;p.ddx=dx/l;p.ddy=dy/l;
      p.dashT=0.18;p.dashCd=fl.id==='emerald'?0.32:0.45;p.inv=Math.max(p.inv,0.35);
      sfx('dash');shake=Math.max(shake,1.5);p.lastTrail={x:p.x,y:p.y};
    }else{sfx('deny');addText('LOW FUEL',p.x,p.y-12,8);p.dashCd=0.35;}
  }

  const spd=62*fl.spdMod*(p.boost>0?1.25:1)*(CON.speedBoost?1.75:1);let vx,vy;
  if(p.dashT>0){
    p.dashT-=dt;vx=p.ddx*250;vy=p.ddy*250;
    for(let k=0;k<3;k++)part(p.x+(R()-.5)*8,p.y+(R()-.5)*8,-p.ddx*30+(R()-.5)*20,-p.ddy*30+(R()-.5)*20,[8,9,10][k],0.3,0);
    const cx=Math.floor(p.x/16),cy=Math.floor(p.y/16);for(const [dx,dy] of DIR4)ignite(cx+dx,cy+dy);
    if(G.upg.trail&&p.lastTrail&&Math.hypot(p.x-p.lastTrail.x,p.y-p.lastTrail.y)>7){F.trails.push({x:p.x,y:p.y,t:6});p.lastTrail={x:p.x,y:p.y};}
  }else{const l=Math.hypot(ix,iy)||1;vx=ix/l*spd;vy=iy/l*spd;}

  vx+=p.kx;vy+=p.ky;const kf=Math.pow(0.0005,dt);p.kx*=kf;p.ky*=kf;
  const bx=moveAxis(p,vx*dt,0,'p',true),by=moveAxis(p,0,vy*dt,'p',true);
  if(p.dashT>0&&(bx===2||by===2)){ignite(Math.floor((p.x+p.ddx*9)/16),Math.floor((p.y+p.ddy*9)/16));sparks(p.x+p.ddx*6,p.y+p.ddy*6,6);p.dashT=0;}
  p.moving=!!(ix||iy||p.dashT>0);

  if(G.upg.dynamo&&p.moving&&G.dynamoCharge<1){
    G.dynamoCharge=Math.min(1,G.dynamoCharge+dt*0.65);
    if(G.dynamoCharge>=1)sfx('blip');
  }

  const ccx=Math.floor(p.x/16),ccy=Math.floor(p.y/16),ct=tAt(ccx,ccy);
  if(ct===T.WATER&&!G.upg.cryo&&!CON.infFuel&&!CON.god){
    G.fuel-=15*dt;p.waterT+=dt;
    if(p.dashT>0){p.dashT=0;sfx('sizzle');steamBurst(p.x,p.y,10);}
    if(R()<dt*12)steamBurst(p.x,p.y-4,1);
    if(p.waterT>0.35){p.waterT=0;sfx('sizzle');}
  }
  if(ct===T.STEAM&&G.upg.veil&&p.moving){if(p.invis<=0)addText('VEIL',p.x,p.y-12,6);p.invis=2;p.boost=2;}
  if(ct===T.EXIT&&F.exitOpen){floorClear();return;}

  if(!CON.infFuel)G.fuel-=(G.upg.cryo?0.25:0.5)*dt;
  let near=false;
  for(let yy=ccy-1;yy<=ccy+1;yy++)for(let xx=ccx-1;xx<=ccx+1;xx++){if(xx<0||yy<0||xx>=GW||yy>=GH)continue;const t=tAt(xx,yy),i=yy*GW+xx;if(t===T.BRAZ||t===T.CAMP||F.burn[i]>0){if(Math.hypot(xx*16+8-p.x,yy*16+8-p.y)<24)near=true;}}
  p.charging=near&&G.fuel<G.maxFuel;
  if(p.charging){G.fuel=Math.min(G.maxFuel,G.fuel+14*dt);if(R()<dt*25)part(p.x+(R()-.5)*14,p.y+6,0,-25-R()*15,R()<.5?10:9,0.4,0);}
  if(G.fuel<=0)killPlayer();
}

// ================= ENEMIES & OVERHAULED MULTI-PHASE BOSSES =================
function updateEnemies(dt){
  for(const e of F.enemies){
    if(e.hp<=0)continue;
    e.anim+=dt;e.flash-=dt;e.burnCd-=dt;
    if(CON.freeze)continue;
    if(Math.abs(e.kx)+Math.abs(e.ky)>2){moveE(e,e.kx*dt,e.ky*dt);const f=Math.pow(0.002,dt);e.kx*=f;e.ky*=f;}
    const dx=P.x-e.x,dy=P.y-e.y,dist=Math.hypot(dx,dy)||1;
    const sees=canSee(e);

    if(e.type==='clock'){
      if(e.state==='patrol'){if(moveE(e,e.dir.x*26*dt,e.dir.y*26*dt)){e.dir.x*=-1;e.dir.y*=-1;}if(e.dir.x)e.face=e.dir.x;
        e.t-=dt;if(e.t<=0){e.t=2+R()*3;if(R()<.35)e.dir={x:e.dir.y,y:e.dir.x};}
        if(sees){const al=e.dir.x?(Math.abs(dy)<9&&Math.sign(dx)===e.dir.x&&Math.abs(dx)<=64):(Math.abs(dx)<9&&Math.sign(dy)===e.dir.y&&Math.abs(dy)<=64);if(al){e.state='alert';e.t=0.6;sfx('alert');}}}
      else if(e.state==='alert'){e.t-=dt;if(e.t<=0){e.state='lunge';e.t=0.35;sfx('lunge');}}
      else if(e.state==='lunge'){e.t-=dt;const r=moveE(e,e.dir.x*175*dt,e.dir.y*175*dt);const sx=e.x+e.dir.x*13,sy=e.y+e.dir.y*13;
        if(Math.hypot(P.x-sx,P.y-sy)<8)hurtPlayer(20,e.x,e.y);
        if(r||e.t<=0){e.state='recover';e.t=0.8;if(r)sparks(sx,sy,6,[6,7,5]);}}
      else if(e.state==='recover'){e.t-=dt;if(e.t<=0){e.state='patrol';e.t=2;}}
    }else if(e.type==='drone'){
      e.bob=Math.sin(e.anim*3)*2;
      if(sees){if(dist>22)moveE(e,dx/dist*16*dt,dy/dist*16*dt);e.face=dx<0?-1:1;}
      else{e.wt-=dt;if(e.wt<=0){e.wt=1+R()*1.5;const a=R()*Math.PI*2;e.wx=Math.cos(a)*10;e.wy=Math.sin(a)*10;}if(moveE(e,e.wx*dt,e.wy*dt))e.wt=0;}
      if(!sees&&e.fireT<0.6)e.fireT=0.6;
      e.fireT-=dt;
      if(e.fireT<=0){if(sees){F.projs.push({k:'drop',x:e.x,y:e.y,vx:dx/dist*85,vy:dy/dist*85,life:3});sfx('bloop');e.fireT=2.5;}else e.fireT=0.6;}
      e.charging=sees&&e.fireT<0.6;
    }else if(e.type==='beetle'){
      if(e.state==='skitter'){e.moveT-=dt;if(e.moveT<=0){e.moveT=0.25+R()*0.7;const a=R()*Math.PI*2,s=R()<.15?0:1;e.mdx=Math.cos(a)*s;e.mdy=Math.sin(a)*s;}
        if(moveE(e,e.mdx*42*dt,e.mdy*42*dt))e.moveT=0;if(e.mdx)e.face=Math.sign(e.mdx);
        e.zapT-=dt;if(e.zapT<=0){e.state='charge';e.t=0.7;sfx('charge');}}
      else if(e.state==='charge'){e.t-=dt;if(e.t<=0){discharge(e,true);e.state='skitter';e.zapT=3+R()*2.5;}}
    }else if(e.type==='turret'){
      e.face=dx<0?-1:1;
      if(sees){e.fireT-=dt;if(e.fireT<=0){F.projs.push({k:'bolt',x:e.x,y:e.y,vx:dx/dist*105,vy:dy/dist*105,life:2.8});sfx('shoot');e.fireT=2.1;}}
    }else if(e.type==='knight'){
      if(sees){moveE(e,dx/dist*28*dt,dy/dist*28*dt);e.face=dx<0?-1:1;}
      else{if(moveE(e,e.dir.x*20*dt,e.dir.y*20*dt)){e.dir.x*=-1;e.face=e.dir.x;}}
    }else if(e.type==='boss'){
      e.t-=dt;
      const enraged=e.hp<e.maxhp*0.5;
      const rage=enraged?1.45:1.0;
      const projK=(e.bossType==='leviathan'||e.bossType==='cryo')?'drop':'bolt';

      if(e.state==='chase'){
        if(dist>18)moveE(e,dx/dist*34*rage*dt,dy/dist*34*rage*dt);
        e.face=dx<0?-1:1;
        if(e.t<=0){
          e.atkCycle=(e.atkCycle+1)%3;
          if(e.atkCycle===0){e.state='windSpread';e.t=0.45;sfx('alert');}
          else if(e.atkCycle===1){e.state='windC';e.t=0.50;sfx('alert');}
          else{e.state='windV';e.t=0.55;sfx('charge');}
        }
      }else if(e.state==='windSpread'){
        if(e.t<=0){
          const baseAng=Math.atan2(dy,dx);
          const count=enraged?7:5;
          const stepAng=0.22;
          for(let k=0;k<count;k++){
            const a=baseAng+(k-(count-1)/2)*stepAng;
            F.projs.push({k:projK,x:e.x,y:e.y,vx:Math.cos(a)*112*rage,vy:Math.sin(a)*112*rage,life:3.2});
          }
          sfx('shoot');
          e.state='chase';e.t=(1.05+R()*0.3)/rage;
        }
      }else if(e.state==='windC'){
        if(e.t<=0){
          e.state='charge';e.t=0.52;
          e.cdx=dx/dist;e.cdy=dy/dist;
          sfx('lunge');
        }
      }else if(e.state==='charge'){
        const r=moveE(e,e.cdx*195*rage*dt,e.cdy*195*rage*dt);
        if(R()<0.5)part(e.x,e.y,-e.cdx*40,-e.cdy*40,10,0.25,0);
        if(r||e.t<=0){
          shake=Math.max(shake,5);
          sparks(e.x,e.y,14,[8,9,10,7],100);
          const ringN=enraged?10:6;
          for(let k=0;k<ringN;k++){
            const a=(k/ringN)*Math.PI*2;
            F.projs.push({k:projK,x:e.x,y:e.y,vx:Math.cos(a)*85,vy:Math.sin(a)*85,life:2.6});
          }
          if(e.bossType==='volt'||e.bossType==='omega'||e.bossType==='prime')discharge(e,true);
          e.state='chase';e.t=(1.15+R()*0.3)/rage;
        }
      }else if(e.state==='windV'){
        if(e.t<=0){
          e.spin+=0.45;
          const nBolts=Math.min(18,10+Math.floor(G.floor/5)*2);
          for(let k=0;k<nBolts;k++){
            const a=e.spin+k/nBolts*Math.PI*2;
            F.projs.push({k:projK,x:e.x,y:e.y,vx:Math.cos(a)*88*rage,vy:Math.sin(a)*88*rage,life:3.4});
          }
          if((e.bossType==='magma'||e.bossType==='prime')&&R()<0.75){
            const bx=clamp(Math.floor(e.x/16)+(R()<.5?-2:2),2,13),by=clamp(Math.floor(e.y/16),2,9);
            if(F.map[by*GW+bx]===T.FLOOR)F.map[by*GW+bx]=T.BARREL;
          }
          if((e.bossType==='weaver'||e.bossType==='inquisitor'||e.bossType==='prime')&&F.enemies.length<5){
            const minion=e.bossType==='inquisitor'?'knight':'drone';
            F.enemies.push(mkEnemy(minion,clamp(Math.floor(e.x/16),2,13),clamp(Math.floor(e.y/16),2,9),G.floor));
          }
          sfx('volley');e.state='chase';e.t=(1.25+R()*0.3)/rage;
        }
      }
    }
    if(!P.dead&&dist<(e.boss?16:10))hurtPlayer(e.boss?25:20,e.x,e.y);
    if(e.burnCd<=0)for(const tr of F.trails)if(Math.hypot(tr.x-e.x,tr.y-e.y)<10){damageEnemy(e,1);e.burnCd=0.5;break;}
  }
  F.enemies=F.enemies.filter(e=>e.hp>0);
}

// ================= PROJECTILES =================
function updateProjs(dt){
  for(const pr of F.projs){
    if(pr.dead)continue;pr.life-=dt;if(pr.life<=0){pr.dead=1;continue;}
    const steps=Math.max(1,Math.ceil(Math.hypot(pr.vx,pr.vy)*dt/3));
    for(let s=0;s<steps&&!pr.dead;s++){
      pr.x+=pr.vx*dt/steps;pr.y+=pr.vy*dt/steps;
      const cx=Math.floor(pr.x/16),cy=Math.floor(pr.y/16),i=cy*GW+cx,t=tAt(cx,cy);
      if(pr.k==='fb'){
        if(t===T.WATER){
          if(pr.arc){
            const set=floodWater(cx,cy);
            for(const j of set){F.arcs.push({i:j,t:0.4});for(const o of F.enemies)if(o.hp>0&&Math.floor(o.y/16)*GW+Math.floor(o.x/16)===j)damageEnemy(o,3);}
            sfx('zap');
          }
          F.map[i]=T.STEAM;F.steamT[i]=5;sfx('sizzle');steamBurst(cx*16+8,cy*16+8,14);pr.dead=1;break;
        }
        if(t===T.GRATE){if(pr.blue||pr.super){F.map[i]=T.ASH;sparks(cx*16+8,cy*16+8,14,[12,7,6,1],80);sfx('melt');}else sparks(pr.x,pr.y,5,[6,5,9]);pr.dead=1;break;}
        if(isSolid(t,'f')){if(isFlam(t)||t===T.BARREL||t===T.ICE)ignite(cx,cy);sparks(pr.x,pr.y,6);pr.dead=1;break;}
        for(const e of F.enemies){
          const r=e.boss?12:7;
          if(e.hp>0&&!pr.hitSet.has(e)&&Math.abs(e.x-pr.x)<r&&Math.abs(e.y-pr.y)<r){
            pr.hitSet.add(e);
            if(e.type==='knight'&&!pr.blue&&!pr.super&&Math.sign(pr.vx)===-e.face){
              sfx('reflect');sparks(pr.x,pr.y,6,[7,12]);pr.vx*=-1;pr.k='bolt';break;
            }
            damageEnemy(e,pr.dmg||1);
            if(pr.arc){
              for(const o of F.enemies)if(o!==e&&o.hp>0&&Math.hypot(o.x-e.x,o.y-e.y)<44){
                damageEnemy(o,1);F.arcs.push({i:Math.floor(o.y/16)*GW+Math.floor(o.x/16),t:0.25});sfx('zap');break;
              }
            }
            if(!e.boss){e.kx+=pr.vx*0.45;e.ky+=pr.vy*0.45;}
            sparks(pr.x,pr.y,8);
            if(!pr.pierce&&!pr.super){pr.dead=1;break;}
          }
        }
        if(pr.dead)break;
        for(const d of F.projs)if(d.k==='drop'&&!d.dead&&Math.hypot(d.x-pr.x,d.y-pr.y)<6){d.dead=1;if(!pr.pierce)pr.dead=1;steamBurst(pr.x,pr.y,6);sfx('sizzle');break;}
      }else if(pr.k==='drop'){
        if(t!==T.GRATE&&t!==T.WATER&&t!==T.STEAM&&isSolid(t,'e')||t===T.EXIT){if(F.burn[i]>0){extinguish(i);steamBurst(cx*16+8,cy*16+8,10);sfx('sizzle');}else drips(pr.x,pr.y,4);pr.dead=1;break;}
        for(const tr of F.trails)if(tr.t>0&&Math.hypot(tr.x-pr.x,tr.y-pr.y)<7){tr.t=0;steamBurst(tr.x,tr.y,4);}
        if(!P.dead&&Math.hypot(P.x-pr.x,P.y-pr.y)<7){pr.dead=1;drips(pr.x,pr.y,6);if(P.inv<=0&&!CON.god){G.fuel-=12;P.inv=0.6;P.hurtT=0.6;sfx('sizzle');addText('-12',P.x,P.y-10,12);shake=Math.max(shake,2);steamBurst(P.x,P.y,6);if(G.fuel<=0)killPlayer();}break;}
      }else{
        if(isSolid(t,'e')&&t!==T.GRATE||t===T.EXIT){sparks(pr.x,pr.y,4,[2,14,7]);pr.dead=1;break;}
        if(!P.dead&&Math.hypot(P.x-pr.x,P.y-pr.y)<7){pr.dead=1;hurtPlayer(20,pr.x,pr.y);break;}
      }
    }
    if(!pr.dead&&pr.k==='fb'&&R()<.7)part(pr.x,pr.y,(R()-.5)*10,(R()-.5)*10,pr.super?10:pr.blue?(R()<.5?12:6):(R()<.5?9:8),0.2,0);
  }
  F.projs=F.projs.filter(p=>!p.dead);
}

function updateFx(dt){

function update(dt){

  if(hit('KeyM'))toggleMute();

  // 8-Second Loading Animation State

    loadState.t+=dt;
    if(R()<0.65){
      const px0=30+(loadState.t/loadState.dur)*196;
      part(px0,148,(R()-.5)*25,-25-R()*35,[8,9,10,7][ri(0,3)],0.45+R()*0.3,20);
    }
    updateFx(dt);
    if(loadState.t>=loadState.dur||hit('Space','Enter','NumpadEnter')){
      loadState.active=false;
      clearInputEdge();
      if(loadState.nextMode==='newrun'){newRun(false,selectedCheckpoint);}

    }

  }

  // Interactive Story Cutscenes

    if(CS.charIdx<curLine.length){

      while(CS.charT>=0.022&&CS.charIdx<curLine.length){

    }
    const art=CS.data.art;
    if(art==='awakening'){
      if(R()<0.65)part(116+R()*24,72,(R()-.5)*22,-25-R()*35,[8,9,10,7][ri(0,3)],0.65,0);
      if(R()<0.45)part(24+R()*208,34,(R()-.5)*14,18+R()*22,7,1.4,0);
    }else if(art==='aqueduct'){
      if(R()<0.6)part(28+R()*200,98,(R()-.5)*12,-18-R()*26,[12,7,6][ri(0,2)],0.85,-5);
    }else if(art==='voltaic'){
      if(R()<0.7)part(32+R()*192,42+R()*52,(R()-.5)*70,(R()-.5)*70,[10,7,13][ri(0,2)],0.28,0);
    }else if(art==='obsidian'){
      if(R()<0.7)part(28+R()*200,104,(R()-.5)*24,-28-R()*40,[8,9,10][ri(0,2)],0.65,-8);
    }else if(art==='aether'){
      if(R()<0.7)part(28+R()*200,104,(R()-.5)*18,-22-R()*32,[14,2,10,7][ri(0,3)],0.75,-6);
    }else if(art==='victory'){
      if(R()<0.8)part(24+R()*208,110,(R()-.5)*35,-38-R()*48,[10,9,7,11][ri(0,3)],0.9,-10);
    }

    updateFx(dt);
    if(CS.lockT<=0&&(hit('Enter','NumpadEnter','Space','KeyJ','KeyZ')||mouse.lHit)){
      if(CS.charIdx<curLine.length){
        CS.charIdx=curLine.length;
      }else if(CS.lineIdx<CS.data.lines.length-1){
        CS.lineIdx++;CS.charIdx=0;CS.charT=0;sfx('blip');
      }else{
        CS.active=false;
        clearInputEdge();
        if(CS.onDone)CS.onDone();
      }
    }
    if(CS.lockT<=0&&hit('Escape')){
      CS.active=false;
      clearInputEdge();
      if(CS.onDone)CS.onDone();
    }
    return;
  }

  if(hit('KeyL')){
    loreOpen=!loreOpen;
    if(loreOpen&&G)lorePage=(G.floor-1)%STORY_CHRONICLES.length;

  }
  if(loreOpen){
    if(hit('KeyA','ArrowLeft')){lorePage=(lorePage+STORY_CHRONICLES.length-1)%STORY_CHRONICLES.length;sfx('blip');}
    if(hit('KeyD','ArrowRight')){lorePage=(lorePage+1)%STORY_CHRONICLES.length;sfx('blip');}
    if(hit('Escape','KeyE','Space','Enter')){loreOpen=false;clearInputEdge();sfx('blip');}

    if(hit('KeyS','ArrowDown'))cycleCheckpoint(1);

  }

}

// ================= LIGHTING (palette-safe ordered dither) =================
const LC=mkCanvas(W,H),lctx=LC.getContext('2d'),LID=lctx.createImageData(W,H),L32=new Uint32Array(LID.data.buffer);
function applyLight(srcs,cap,h){
  L32.fill(0);const bw=W>>2,bh=h>>2;
  for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){
    const cx=bx*4+2,cy=by*4+2;let best=9;
    for(const s of srcs){const dx=cx-s.x,dy=cy-s.y,v=(dx*dx+dy*dy)/(s.r*s.r);if(v<best)best=v;}
    let lv=best<0.30?0:best<0.56?1:best<1.0?2:3;if(lv>cap)lv=cap;if(!lv)continue;
    for(let j=0;j<4;j++){const y=by*4+j,row=y*W;for(let i=0;i<4;i++){const x=bx*4+i;
      const blk=lv===1?(x%2===0&&y%2===0):lv===2?((x+y)%2===0):!(x%2===1&&y%2===1);if(blk)L32[row+x]=0xFF000000;}}
  }
  lctx.putImageData(LID,0,0);ctx.drawImage(LC,0,0,W,h,0,0,W,h);
}

function tele(x,y){const c=(frame>>2)%2?10:8;rect(x-3,y-4,7,9,c);rect(x-2,y-3,5,7,0);drawText('!',x-2,y-2,c);}
function drawEnemy(e,af){
  const fr=Math.floor(e.anim*5)%2,flip=e.face<0,white=e.flash>0;
  let set=SP.clock;
  if(e.type==='drone')set=SP.drone;
  else if(e.type==='beetle')set=SP.beetle;

  applyLight([{x:40,y:8,r:46+fl()},{x:104,y:8,r:46+fl()},{x:152,y:8,r:46+fl()},{x:216,y:8,r:46+fl()},{x:128,y:52,r:70+fl()},{x:128,y:150,r:96}],3,224);
  rect(14,82,228,116,0);rect(14,82,228,1,5);rect(14,197,228,1,5);
  const curFl=getPreviewFlame();
  const pset=SP.playerSets[curFl.id]||SP.playerSets.amber;
  blit(pset.n[af],100,8,56,56);
  for(const p of parts){ctx.fillStyle=PAL[p.c];ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);}
  drawTextC('CINDERGEAR',64,10,2,8);
  drawTextC('50-FLOOR ABYSSAL DESCENT',86,9);

  const owned=SAVE.unlocked.includes(curFl.id);
  const coreLabel='< '+curFl.name+(owned?'':' ['+curFl.cost+' SHARDS]')+' >';
  drawTextC(coreLabel,97,owned?curFl.c2:8);
  drawTextC(curFl.desc,106,6);

  const cpLabel='START: FLR '+pad2(selectedCheckpoint)+(SAVE.checkpoints.length>1?' (W/S)':'');
  drawTextC(cpLabel,117,11);
  drawTextC('SHARDS: '+SAVE.bank+'  BEST: '+pad2(SAVE.bestFloor)+'  LORE: '+SAVE.lore.length+'/50',127,12);

  const L=[['WASD + MOUSE','MOVE & AIM'],['CLICK / J / K','SHOOT & DASH'],['[E] READ TABLET','[L] STORY CODEX']];
  L.forEach(([a,b],k)=>{drawText(a,24,140+k*10,10);drawText(b,122,140+k*10,6);});
  drawTextC('REACH FLOOR 50. CLAIM THE SOLAR CROWN.',178,14);
  const prompt=owned?'[PRESS ENTER TO IGNITE]':(SAVE.bank>=curFl.cost?'[PRESS ENTER TO UNLOCK]':'[LOCKED - EARN SHARDS]');
  if(Math.floor(time*2.5)%2===0)drawTextC(prompt,203,owned?10:(SAVE.bank>=curFl.cost?11:8));
  drawTextC('A/D: FLAME CORE   W/S: CHECKPOINT',214,5);
}
function renderShop(){
  const af=Math.floor(time*6)%2;
  for(let x=0;x<16;x++)blit(SP.wall,x*16,0);
  blit(SP.braz[af],0,16);blit(SP.braz[1-af],240,16);
  drawTextC('TINKER SHOP',22,9,2,8);
  drawTextC('FLOOR '+pad2(G.floor)+' CLEARED',42,6);
  blit(SP.gem[Math.floor(time*3)%2],20,52);drawText('GEMS: '+G.gems,31,54,12);
  drawText('FUEL '+Math.ceil(G.fuel)+'/'+G.maxFuel,W-20-textW('FUEL '+Math.ceil(G.fuel)+'/'+G.maxFuel),54,10);
  S.offers.forEach((o,k)=>{const y=66+k*38,sel=S.sel===k;
    rect(16,y,224,34,sel?(S.flash>0?2:1):0);rect(16,y,224,1,sel?10:5);rect(16,y+33,224,1,sel?10:5);rect(16,y,1,34,sel?10:5);rect(239,y,1,34,sel?10:5);
    rect(22,y+5,13,13,o.sold?5:0);rect(23,y+6,11,11,1);drawText(o.l,27,y+9,o.sold?5:o.c);
    drawText(o.name,42,y+5,o.sold?5:7);
    const cs=o.sold?'SOLD':o.cost+'G';drawText(cs,232-textW(cs),y+5,o.sold?5:(G.gems>=o.cost?10:8));
    drawText(o.d1,42,y+15,o.sold?5:6);drawText(o.d2,42,y+23,o.sold?5:6);
    if(sel&&frame%30<20)drawText('>',8,y+12,10);});
  const sel=S.sel===S.offers.length,y=182;
  rect(16,y,224,14,sel?1:0);rect(16,y,224,1,sel?10:5);rect(16,y+13,224,1,sel?10:5);
  drawTextC('DESCEND TO FLOOR '+pad2(G.floor+1),y+5,sel?10:6);if(sel&&frame%30<20)drawText('>',8,y+5,10);
  if(S.msgT>0)drawTextC(S.msg,202,S.msg.includes('NOT')||S.msg.includes('ALREADY')?8:11);
  else drawTextC('W/S SELECT   ENTER BUY',202,13);
}
function renderEnd(){
  ctx.drawImage(SP.dither,0,0);
  const win=state==='win';rect(24,40,208,150,0);rect(24,40,208,1,win?10:8);rect(24,189,208,1,win?10:8);rect(24,40,1,150,win?10:8);rect(231,40,1,150,win?10:8);
  if(win){blit(SP.crown,112,48,32,32);drawTextC('CROWN RECLAIMED!',86,10,2,9);}
  else{blit(SP.playerSets.amber.w[0],112,48,32,32);drawTextC('THE FLAME FADES',86,8,2,2);}
  const lines=[['FLOOR REACHED',pad2(G.floor)+'/50'],['ENEMIES MELTED',String(G.stats.kills)],['BARRELS DETONATED',String(G.stats.barrels)],['GEMS COLLECTED',String(G.stats.gems)]];
  lines.forEach(([a,b],k)=>{drawText(a,40,112+k*12,6);drawText(b,216-textW(b),112+k*12,10);});
  if(Math.floor(time*2.5)%2===0)drawTextC('[PRESS R TO RETRY FLR '+pad2(selectedCheckpoint)+']',172,win?10:9);
}
function renderConsoleOverlay(){
  const ch=84;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.88)';
  ctx.fillRect(0,0,W,ch);
  ctx.restore();
  rect(0,ch-1,W,1,11);
  const startY=ch-18;
  for(let i=0;i<CON.log.length;i++){
    const entry=CON.log[CON.log.length-1-i];
    const y=startY-i*9;
    if(y<3)break;
    drawText(entry.txt,6,y,entry.c);
  }
  rect(0,ch-11,W,1,5);
  const cursor=(frame>>4)%2?'_':'';
  drawText('> '+CON.buf+cursor,6,ch-8,7);
}
function render(){
  ctx.fillStyle=PAL[0];ctx.fillRect(0,0,W,H);
  if(state==='loading')renderLoading();
  else if(state==='cutscene')renderCutscene();
  else if(state==='title')renderTitle();
  else if(state==='shop')renderShop();
  else{
    renderWorld();renderHUD();
    if(state==='clear'){const w=164,x=(W-w)/2;rect(x,94,w,38,0);rect(x,94,w,1,10);rect(x,131,w,1,10);
      drawTextC(G.floor>=50?'SOLAR CROWN YOURS!':(G.floor%5===0?'CHECKPOINT SAVED!':'FLOOR CLEARED!'),102,10);
      drawTextC(G.floor>=50?'ASCENDING...':'DESCENDING...',116,6);}
    if(state==='over'||state==='win')renderEnd();
  }
  if(loreOpen)renderLoreOverlay();
  if(CON.open)renderConsoleOverlay();
  if(mouse.inBounds){
    const mx=Math.round(mouse.x),my=Math.round(mouse.y);
    const cc=CON.clickBoom?8:10;
    px(mx-3,my,cc);px(mx-2,my,cc);px(mx+2,my,cc);px(mx+3,my,cc);
    px(mx,my-3,cc);px(mx,my-2,cc);px(mx,my+2,cc);px(mx,my+3,cc);
    px(mx,my,7);
  }
}

// ================= MAIN LOOP =================
startLoading('title','INITIALIZING CORE');
let last=performance.now(),acc=0;const STEP=1/60;
function loop(now){
  let d=(now-last)/1000;last=now;if(d>0.1)d=0.1;acc+=d;
  while(acc>=STEP){update(STEP);clearInputEdge();acc-=STEP;}
  render();requestAnimationFrame(loop);
}
cv.focus();
requestAnimationFrame(loop);
</script>
